`,devBonus:`Information`},{key:`analyse`,attr:`processeur`,label:`Analyse`,desc:`comprendre`,devBonus:null},{key:`contestation`,attr:`reseau`,label:`Contestation`,desc:`libre arbitre`,devBonus:null},{key:`interaction`,attr:`reseau`,label:`Interaction`,desc:`convaincre`,devBonus:null},{key:`reparation`,attr:`reseau`,label:`Réparation`,desc:`soin ou modification`,devBonus:null}],devThresholds:[{min:76,bonus:3,energyEp:7},{min:51,bonus:2,energyEp:6},{min:41,bonus:2,energyEp:5},{min:31,bonus:1,energyEp:4},{min:21,bonus:1,energyEp:3},{min:11,bonus:0,energyEp:2},{min:1,bonus:-1,energyEp:1},{min:0,bonus:-2,energyEp:0}],coverPresets:[{name:`Meuble`,armor:3},{name:`Porte blindée`,armor:5},{name:`Mur`,armor:7}],specialPrograms:{battle:`Verrouiller une cible à vue (action) : +1 à toutes vos attaques contre elle, mais +1 aux attaques des autres ennemis contre vous. Succès en plus : +1 attaque, +1 initiative ou +1 dégât.`,cleaning:`Décontaminer de la Pourriture une zone de 10 × 10 m (+10 × 10 m par succès en plus). Attaque aussi les essaims : dégât 3, portée Courte.`,companion:`Convaincre, mentir, séduire humains, mutants, animaux et robots (jet opposé). Succès en plus : 1 doute ou 1 confusion à la cible.`,coordination:`Plan d'une action pour jusqu'à 4 alliés : chacun gagne +1 par succès s'il suit le plan. En conflit, ils agissent à votre initiative.`,industrial:`Fabriquer en quelques heures un objet (+1 en équipement, une utilisation). Succès en plus : durable, +1 bonus, +1 dégât… Peut aussi surcadencer un robot.`,protocol:`Avant le jet d'un allié à portée Courte : en cas de succès, il peut renoncer à son action après son jet. +1 à son action par succès en plus.`,scrap:`Trouver dans votre collection l'outil qu'il faut : bonus d'équipement = nombre de succès. Sert aussi à troquer (1 fois par jour).`,security:`Quand quelqu'un à portée Proche subit une attaque extérieure : encaissez 1 dégât à sa place par succès (pas une action, 1 fois par round).`},overheatTable:[{roll:1,name:`Erreur fatale !`,effect:`Le module tombe en panne : il faut le Réparer avant de le réutiliser. Votre action n'a aucun effet.`},{roll:2,name:`Bug !`,effect:`Le module fonctionne mais consomme le double de PE. Si vous tombez à 0 PE, vous passez en veille.`},{roll:3,name:`Fils croisés !`,effect:`Un autre de vos modules (au hasard) s'active à la place ; le MJ décide de l'effet. Relancez si vous n'avez qu'un module.`},{roll:4,name:`Écran bleu !`,effect:`Redémarrage : votre action n'a aucun effet et vous restez inactif jusqu'à votre tour au round suivant.`},{roll:5,name:`Effacement mémoire !`,effect:`Vous gardez vos programmes mais oubliez votre vie passée. Un robot (ou un Bricoleur) peut la restaurer : Réparation réussie et quelques heures.`},{roll:6,name:`Surtension !`,effect:`L'effet est plus puissant : chaque PE dépensé compte double. Relancez si plusieurs PE ne changent rien pour ce module.`}],damageTable:[{min:1,max:2,target:`servos`},{min:3,max:3,target:`stabilite`},{min:4,max:4,target:`processeur`},{min:5,max:5,target:`reseau`},{min:6,max:6,target:`module`}],xpQuestions:[`Avez-vous participé à la séance ?`,`Avez-vous tenté d'éliminer une Erreur sur ordre d'un supérieur ?`,`Avez-vous risqué ou sacrifié quelque chose pour votre binôme ?`,`Avez-vous risqué ou sacrifié quelque chose pour le PNJ que vous protégez ?`,`Avez-vous risqué ou sacrifié quelque chose pour nuire au PNJ que vous détestez ?`,`Avez-vous risqué ou sacrifié quelque chose pour votre grand rêve ?`],npcTemplates:[{id:`household-drone`,name:`Drone ménager`,group:`Grand public`,body:`drone`,attrs:[1,1,0,0],armor:1,programs:{},secondary:[],modules:[],weapons:[],gear:`Appareil ménager intégré`},{id:`home-antoine`,name:`Robot domestique Home-Antoine`,group:`Grand public`,body:`robot`,attrs:[2,2,2,3],armor:2,programs:{interaction:4},secondary:[],modules:[],weapons:[],gear:`Aspirateur, lave-linge, presse et lampe intégrés`},{id:`toy`,name:`Robot jouet`,group:`Grand public`,body:`robot`,attrs:[2,3,2,3],armor:1,p weapons:[{name:`Morsure`,bonus:``,degats:2,portee:`Bras`}],gear:``},{id:`zone-rats`,name:`Rats de la Zone (essaim)`,group:`Créatures`,body:`creature`,attrs:[8,5,0,0],armor:0,programs:{},secondary:[],modules:[],weapons:[{name:`Dents`,bonus:``,degats:1,portee:`Bras`}],gear:``,note:`Essaim : seuls le feu, les explosions, Nettoyer et l'Impulsion énergétique le blessent.`},{id:`worm-swarm`,name:`Essaim de vers`,group:`Créatures`,body:`creature`,attrs:[8,0,0,0],armor:0,programs:{},secondary:[],modules:[],weapons:[{name:`Engloutissement`,bonus:``,degats:1,portee:`Bras`}],gear:``,note:`Essaim : seuls le feu, les explosions, Nettoyer et l'Impulsion énergétique le blessent.`}],droneDamageTable:[{min:1,max:3,target:`servos`},{min:4,max:5,target:`stabilite`},{min:6,max:6,target:`module`}],creatureLabels:{servos:{label:`Force`,short:`For`,sub:`dégâts`},stabilite:{label:`Agilité`,short:`Agi`,sub:`fatigue`},processeur:{label:`Intellect`,short:`Int`,sub:`confusion`},reseau:{label:`Empathie`,short:`Emp`,sub:`doute`}},combatGuide:[{id:`tour`,title:`Tour de jeu`,tone:`amber`,items:[{h:`Initiative`,t:`1D6 chacun au premier tour, sans forcer. Égalité : la Stabilité actuelle la plus haute (Agilité pour un vivant), puis un dé. Elle ne se relance jamais.`},{h:`À votre tour`,t:`Une action et une manœuvre, ou deux manœuvres.`},{h:`Actions`,t:`Lancer un programme, activer un module, aider quelqu'un (+1 à son jet).`},{h:`Manœuvres`,t:`Se déplacer d'une portée, se mettre à couvert, se relever, prendre ou dégainer un objet, viser, se mettre en surveillance.`},{h:`Attendre`,t:`Au lieu d'agir, baissez votre initiative à la valeur voulue ; elle reste basse pour la suite.`},{h:`Monter l'initiative`,t:`Attaque surprise +2 (premier tour), Accélérateur +2 par PE, Tactiques SWAT (deux dés), certains succès en plus.`}]},{id:`melee`,title:`Corps à corps`,tone:`fault`,items:[{h:`Attaque`,t:`Assaut (Servos), en général à portée Bras, debout. Touché : dégâts de l'arme.`},{h:`Succès en plus`,t:`+1 dégât chacun, ou +2 initiative au tour suivant, désarmer (initiative adverse −1), renverser ou repousser, immobiliser.`},{h:`Se défendre`,t:`À déclarer avant le jet adverse. Les deux lancent Assaut ; chaque succès du défenseur annule un succès, ou sert à contre-attaquer, +2 initiative, désarmer, renverser. Coûte la prochaine action, une seule défense par tour.`},{h:`Immobilisation`,t:`La victime doit gagner un Assaut opposé pour se libérer. Attaque d'immobilisation : sans arme, +2, impossible à parer.`}]},{id:`tir`,title:`Tir`,tone:`coolant`,items:[{h:`Attaque`,t:`Tir (Stabilité) avec une arme à distance. On ne peut pas parer un tir : mettez-vous à couvert.`},{h:`Portée`,t:`Bras −3 (sauf cible sans défense), Proche 0, Courte −1, Longue −2. L'arme limite la portée maximale.`},{h:`Viser`,t:`Une manœuvre : +1, ou +2 appuyé à une couverture. Perdu si vous faites autre chose avant de tirer.`},{h:`Succès en plus`,t:`+1 dégât chacun, ou +2 initiative au tour suivant, faire lâcher une arme (initiative adverse −1), renverser.`},{h:`Recharge`,t:`Arme à énergie sur E-pack : si tous les dés d'équipement font 1 au premier jet, l'E-pack est vide et le tir est perdu.`},{h:`Surveillance`,t:`Manœuvre : vous pourrez tirer avant toute action dans votre arc de 90° jusqu'à votre prochain tour. Rompue si vous agissez, êtes attaqué au contact ou blessé.`}]},{id:`degats`,title:`Dégâts et armure`,tone:`steel`,items:[{h:`Couverture`,t:`Contre les tirs seulement, lancée en premier : meuble 3, porte blindée 5, mur 7.`},{h:`Armure`,t:`Autant de dés d'équipement que l'armure ; chaque 6 retire 1 dégât. Si au moins 1 dégât passe, chaque 1 use la protection d'un point.`},{h:`Localisation`,t:`D6 : 1-2 Servos, 3 Stabilité, 4 Processeur, 5 Réseau, 6 un module. Drone : 1-3 Servos, 4-5 Stabilité, 6 module. L'excès relance la localisation.`},{h:`Brisé`,t:`Attribut à 0 : programmes inutilisables. Les quatre à 0 : désactivation définitive. Un module casse au premier point.`}]},{id:`move`,title:`Déplacement et fuite`,tone:`muted`,items:[{h:`Se déplacer`,t:`Bras ↔ Proche ↔ Courte : 1 manœuvre par portée. Au-delà de Courte : 2 manœuvres d'affilée par portée.`},{h:`Fuir`,t:`Jet de Déplacement : Bras −2, Proche −1, Courte 0, Longue +1, Lointaine réussite automatique. Seulement par où vous êtes venu.`}]},{id:`soutien`,title:`Soutien et conflits logiques`,tone:`amber`,items:[{h:`Aider`,t:`Remplace votre action (pas votre manœuvre) : +1 au jet de l'allié. Un groupe de PNJ peut attaquer d'un seul jet, +1 par membre qui aide.`},{h:`Calculer (Robot de protocole)`,t:`Annoncé avant le jet d'un allié à portée Courte, lancé avant lui ; coûte votre action. Réussite : l'allié peut renoncer après son jet, avant de forcer, et choisir une autre action. +1 à son action par succès en plus.`},{h:`Raisonner`,t:`Interaction contre Contestation, entre robots seulement (un seul jet si la cible n'est pas consciente d'elle-même). +1 par cran de Hiérarchie d'écart, +1 par argument de base logique de chaque côté. Plus de succès que l'adversaire : il obéit. Succès en plus : 1 dégât de Réseau chacun.`},{h:`Manipuler (Robot de compagnie)`,t:`Contre Contestation ou, pour les vivants, Percevoir les émotions ; la Hiérarchie ne compte pas. Un vivant convaincu voudra quelque chose en retour.`},{h:`Essaims`,t:`Seuls le feu, les explosions, Nettoyer (dégâts 3, portée Courte, sans bonus) et l'Impulsion énergétique les blessent.`}]},{id:`energie`,title:`Énergie et modules`,tone:`coolant`,items:[{h:`Activer un module`,t:`C'est une action, sauf les effets « avec une attaque » (E), qui s'ajoutent à un jet ou une manœuvre, et les réactions (R), utilisables à tout moment tant qu'il reste des PE.`},{h:`Surchauffe`,t:`Un dé d'équipement par PE dépensé. Un seul 1 : D6 sur la table (module cassé, coût doublé, autre module, redémarrage, effacement mémoire, surtension).`},{h:`Veille`,t:`À 0 PE, le robot est totalement inactif. Il se réveille un tour après avoir reçu au moins 1 PE.`},{h:`Armes à énergie`,t:`E-pack : vide si tous les dés d'équipement font 1 au premier jet, l'attaque est perdue. Alimentation interne : 1 PE par tir. Manivelle : une action pour la remonter après chaque tir.`},{h:`Recharger`,t:`E-pack ou batterie : +D6 PE, puis vide. Transfert de PE par câble entre robots. Les PNJ paient dans la réserve du MJ : niveau d'énergie × nombre de PJ, par séance.`}]},{id:`surprise`,title:`Attaques surprises`,tone:`muted`,items:[{h:`Approche`,t:`Infiltration contre Scan, modifiée par la distance d'arrivée (Bras −2 … Lointaine +2). Réussite : une action gratuite avant l'initiative.`},{h:`Embuscade`,t:`+2 à l'Infiltration, car vous êtes immobile. Attaque inattendue : +2 à l'initiative pour tout le combat.`}]}],shootRanges:[{id:`Bras`,label:`Bras`,mod:-3},{id:`Proche`,label:`Proche`,mod:0},{id:`Courte`,label:`Courte`,mod:-1},{id:`Longue`,label:`Longue`,mod:-2},{id:`Lointaine`,label:`Lointaine`,mod:-3,gm:!0}],fleeMods:{Bras:-2,Proche:-1,Courte:0,Longue:1,Lointaine:null},pcColors:[{hex:`#5B9BFF`,name:`Bleu`},{hex:`#B07CFF`,name:`Violet`},{hex:`#46C47E`,name:`Vert`},{hex:`#F47CB0`,name:`Rose`},{hex:`#D9B84A`,name:`Or`},{hex:`#A3D65C`,name:`Lime`},{hex:`#56C2E6`,name:`Ciel`},{hex:`#C98B6B`,name:`Cuivre`}],attributeLabels:{servos:{label:`Servos`,short:`Serv`,sub:`force / const.`},stabilite:{label:`Stabilité`,short:`Stab`,sub:`mouv. / agilité`},processeur:{label:`Processeur`,short:`Proc`,sub:`intelligence`},reseau:{label:`Réseau`,short:`Rés`,sub:`interaction`}},rules:{pushKeepsOnes:!0,epBase:10,epBackup:12,programMax:5,creationProgramPoints:10,creationProgramMax:3,xpPerUpgrade:5,startEp:5,dailyDrain:1,outsideSolarEp:1,devStart:50,devDecay:`1D6`},defaults:{attributeMax:6,armorMax:7,coverMax:7,epMax:10,xpMax:15,slotsDefault:3,devDefault:50,devMax:100}},Wi=[`servos`,`stabilite`,`processeur`,`reseau`],Gi=[`Energie`,`Production`,`Défense`,`Information`],Ki={Energie:`Énergie`,Production:`Production`,Défense:`Défense`,Information:`Information`},qi=e=>(e||``).trim().toLowerCase();function Ji(e,t){return(Q.
