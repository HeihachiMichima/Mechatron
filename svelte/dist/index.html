tive au tour suivant, désarmer (initiative adverse −1), renverser ou repousser, immobiliser.`},{h:`Se défendre`,t:`À déclarer avant le jet adverse. Les deux lancent Assaut ; chaque succès du défenseur annule un succès, ou sert à contre-attaquer, +2 initiative, désarmer, renverser. Coûte la prochaine action, une seule défense par tour.`},{h:`Immobilisation`,t:`La victime doit gagner un Assaut opposé pour se libérer. Attaque d'immobilisation : sans arme, +2, impossible à parer.`}]},{id:`tir`,title:`Tir`,tone:`coolant`,items:[{h:`Attaque`,t:`Tir (Stabilité) avec une arme à distance. On ne peut pas parer un tir : mettez-vous à couvert.`},{h:`Portée`,t:`Bras −3 (sauf cible sans défense), Proche 0, Courte −1, Longue −2. L'arme limite la portée maximale.`},{h:`Viser`,t:`Une manœuvre : +1, ou +2 appuyé à une couverture. Perdu si vous faites autre chose avant de tirer.`},{h:`Succès en plus`,t:`+1 dégât chacun, ou +2 initiative au tour suivant, faire lâcher une arme (initiative adverse −1), renverser.`},{h:`Recharge`,t:`Arme à énergie sur E-pack : si tous les dés d'équipement font 1 au premier jet, l'E-pack est vide et le tir est perdu.`},{h:`Surveillance`,t:`Manœuvre : vous pourrez tirer avant toute action dans votre arc de 90° jusqu'à votre prochain tour. Rompue si vous agissez, êtes attaqué au contact ou blessé.`}]},{id:`degats`,title:`Dégâts et armure`,tone:`steel`,items:[{h:`Couverture`,t:`Contre les tirs seulement, lancée en premier : meuble 3, porte blindée 5, mur 7.`},{h:`Armure`,t:`Autant de dés d'équipement que l'armure ; chaque 6 retire 1 dégât. Si au moins 1 dégât passe, chaque 1 use la protection d'un point.`},{h:`Localisation`,t:`D6 : 1-2 Servos, 3 Stabilité, 4 Processeur, 5 Réseau, 6 un module. Drone : 1-3 Servos, 4-5 Stabilité, 6 module. L'excès relance la localisation.`},{h:`Brisé`,t:`Attribut à 0 : programmes inutilisables. Les quatre à 0 : désactivation définitive. Un module casse au premier point.`}]},{id:`move`,title:`Déplacement et fuite`,tone:`muted`,items:[{h:`Se déplacer`,t:`Bras ↔ Proche ↔ Courte : 1 manœuvre par portée. Au-delà de Courte : 2 manœuvres d'affilée par portée.`},{h:`Fuir`,t:`Jet de Déplacement : Bras −2, Proche −1, Courte 0, Longue +1, Lointaine réussite automatique. Seulement par où vous êtes venu.`}]},{id:`soutien`,title:`Soutien et conflits logiques`,tone:`amber`,items:[{h:`Aider`,t:`Remplace votre action (pas votre manœuvre) : +1 au jet de l'allié. Un groupe de PNJ peut attaquer d'un seul jet, +1 par membre qui aide.`},{h:`Calculer (Robot de protocole)`,t:`Annoncé avant le jet d'un allié à portée Courte, lancé avant lui ; coûte votre action. Réussite : l'allié peut renoncer après son jet, avant de forcer, et choisir une autre action. +1 à son action par succès en plus.`},{h:`Raisonner`,t:`Interaction contre Contestation, entre robots seulement (un seul jet si la cible n'est pas consciente d'elle-même). +1 par cran de Hiérarchie d'écart, +1 par argument de base logique de chaque côté. Plus de succès que l'adversaire : il obéit. Succès en plus : 1 dégât de Réseau chacun.`},{h:`Manipuler (Robot de compagnie)`,t:`Contre Contestation ou, pour les vivants, Percevoir les émotions ; la Hiérarchie ne compte pas. Un vivant convaincu voudra quelque chose en retour.`},{h:`Essaims`,t:`Seuls le feu, les explosions, Nettoyer (dégâts 3, portée Courte, sans bonus) et l'Impulsion énergétique les blessent.`}]},{id:`energie`,title:`Énergie et modules`,tone:`coolant`,items:[{h:`Activer un module`,t:`C'est une action, sauf les effets « avec une attaque » (E), qui s'ajoutent à un jet ou une manœuvre, et les réactions (R), utilisables à tout moment tant qu'il reste des PE.`},{h:`Surchauffe`,t:`Un dé d'équipement par PE dépensé. Un seul 1 : D6 sur la table (module cassé, coût doublé, autre module, redémarrage, effacement mémoire, surtension).`},{h:`Veille`,t:`À 0 PE, le robot est totalement inactif. Il se réveille un tour après avoir reçu au moins 1 PE.`},{h:`Armes à énergie`,t:`E-pack : vide si tous les dés d'équipement font 1 au premier jet, l'attaque est perdue. Alimentation interne : 1 PE par tir. Manivelle : une action pour la remonter après chaque tir.`},{h:`Recharger`,t:`E-pack ou batterie : +D6 PE, puis vide. Transfert de PE par câble entre robots. Les PNJ paient dans la réserve du MJ : niveau d'énergie × nombre de PJ, par séance.`}]},{id:`surprise`,title:`Attaques surprises`,tone:`muted`,items:[{h:`Approche`,t:`Infiltration contre Scan, modifiée par la distance d'arrivée (Bras −2 … Lointaine +2). Réussite : une action gratuite avant l'initiative.`},{h:`Embuscade`,t:`+2 à l'Infiltration, car vous êtes immobile. Attaque inattendue : +2 à l'initiative pour tout le combat.`}]}],shootRanges:[{id:`Bras`,label:`Bras`,mod:-3},{id:`Proche`,label:`Proche`,mod:0},{id:`Courte`,label:`Courte`,mod:-1},{id:`Longue`,label:`Longue`,mod:-2},{id:`Lointaine`,label:`Lointaine`,mod:-3,gm:!0}],fleeMods:{Bras:-2,Proche:-1,Courte:0,Longue:1,Lointaine:null},pcColors:[{hex:`#5B9BFF`,name:`Bleu`},{hex:`#B07CFF`,name:`Violet`},{hex:`#46C47E`,name:`Vert`},{hex:`#F47CB0`,name:`Rose`},{hex:`#D9B84A`,name:`Or`},{hex:`#A3D65C`,name:`Lime`},{hex:`#56C2E6`,name:`Ciel`},{hex:`#C98B6B`,name:`Cuivre`}],attributeLabels:{servos:{label:`Servos`,short:`Serv`,sub:`force / const.`},stabilite:{label:`Stabilité`,short:`Stab`,sub:`mouv. / agilité`},processeur:{label:`Processeur`,short:`Proc`,sub:`intelligence`},reseau:{label:`Réseau`,short:`Rés`,sub:`interaction`}},rules:{pushKeepsOnes:!0,epBase:10,epBackup:12,programMax:5,creationProgramPoints:10,creationProgramMax:3,xpPerUpgrade:5,startEp:5,dailyDrain:1,outsideSolarEp:1,devStart:50,devDecay:`1D6`},defaults:{attributeMax:6,armorMax:7,coverMax:7,epMax:10,xpMax:15,slotsDefault:3,devDefault:50,devMax:100}},ea=[`servos`,`stabilite`,`processeur`,`reseau`],ta=[`Energie`,`Production`,`Défense`,`Information`],na={Energie:`Énergie`,Production:`Production`,Défense:`Défense`,Information:`Information`},ra=e=>(e||``).trim().toLowerCase();function ia(e,t){return(Q.chassis[e]||[])
